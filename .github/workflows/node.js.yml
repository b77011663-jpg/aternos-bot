name: Run Aternos Bot 24/7

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Позволяет запускать бота вручную кнопкой

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install dependencies
      run: npm install

    - name: Start Minecraft Bot
      run: node bot.js

